[project]
name = "fittrack-ai-microservice"
version = "0.1.0"
description = "FastAPI service boundary for FitTrack Python-backed AI domains."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0,<1.0.0",
  "httpx>=0.28.0,<1.0.0",
  "mediapipe>=0.10.33,<0.11.0",
  "numpy>=1.26.0,<3.0.0",
  "pillow>=11.0.0,<12.0.0",
  "pydantic>=2.11.0,<3.0.0",
  "ultralytics>=8.4.42",
  "uvicorn>=0.35.0,<1.0.0",
]

[dependency-groups]
dev = [
  "pytest>=8.4.0,<9.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
