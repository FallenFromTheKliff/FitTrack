interface:
  display_name: "FitTrack Goals"
  short_description: "Bounded /goals execution for FitTrack frontend work"
  default_prompt: "Use $goals to run a bounded FitTrack frontend goal with Safe Goals Mode, local static truth first, and Exa only for focused docs or external-reference questions."

dependencies:
  tools:
    - type: "mcp"
      value: "exa"
      description: "Exa MCP for focused docs fetching and external reference checks"
      transport: "streamable_http"
      url: "https://mcp.exa.ai/mcp?tools=web_search_exa,web_fetch_exa"

policy:
  allow_implicit_invocation: true
