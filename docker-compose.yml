volumes:
  postgres_data:

services:
  db:
    image: postgres:16-alpine
    env_file:
      - .env.docker
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - .env.docker
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "node /app/apps/api/node_modules/prisma/build/index.js migrate deploy && node /app/node_modules/.pnpm/ts-node@10.9.2_@types+node@22.19.15_typescript@5.9.3/node_modules/ts-node/dist/bin.js --project /app/tsconfig.json --transpile-only /app/prisma/seed.ts"]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - .env.docker
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://api:3001
